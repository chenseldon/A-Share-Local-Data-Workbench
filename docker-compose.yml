name: ashare-workbench

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASHARE_DB_PATH: /data/ashare.duckdb
      ASHARE_DEMO_DATA: ${ASHARE_DEMO_DATA:-0}
    volumes:
      - ashare-data:/data
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5))['status'])",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ashare-data:
